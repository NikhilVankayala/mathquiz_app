AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CI/CD for MathQuiz: CodePipeline (Source -> Build -> Deploy) using CodeBuild
  and a CloudFormation deploy action. Source is GitHub via a CodeStar Connection.

Parameters:
  GitHubOwner:
    Type: String
    Default: NikhilVankayala
  GitHubRepo:
    Type: String
    Default: mathquiz_app
  GitHubBranch:
    Type: String
    Default: main
  CodeStarConnectionArn:
    Type: String
    Description: ARN of the GitHub CodeStar Connection (create once in the console, then paste here).
  FlaskSecretKey:
    Type: String
    NoEcho: true
    Description: Passed through to the app stack for Flask sessions.

Resources:
  # ---------------------------------------------------------------- ECR
  EcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: mathquiz-app
      ImageScanningConfiguration: { ScanOnPush: true }

  # ---------------------------------------------------------------- Artifact bucket
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub mathquiz-pipeline-artifacts-${AWS::AccountId}

  # ---------------------------------------------------------------- CodeBuild
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: codebuild-perms
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:GetBucketLocation]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                Resource: '*'

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: mathquiz-build
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Source: { Type: CODEPIPELINE, BuildSpec: buildspec.yml }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: true   # needed to run docker build
        EnvironmentVariables:
          - { Name: AWS_ACCOUNT_ID, Value: !Ref AWS::AccountId }
          - { Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region }
          - { Name: ECR_REPO_NAME, Value: !Ref EcrRepo }
          - { Name: ARTIFACT_BUCKET, Value: !Ref ArtifactBucket }

  # ---------------------------------------------------------------- CloudFormation deploy role
  CfnDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      # Broad for a learning project. Tighten to specific services for production.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
        - arn:aws:iam::aws:policy/IAMFullAccess

  # ---------------------------------------------------------------- Pipeline role
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline-perms
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:GetBucketLocation, s3:ListBucket]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
              - Effect: Allow
                Action: [codebuild:BatchGetBuilds, codebuild:StartBuild]
                Resource: !GetAtt BuildProject.Arn
              - Effect: Allow
                Action: [codestar-connections:UseConnection]
                Resource: !Ref CodeStarConnectionArn
              - Effect: Allow
                Action: [cloudformation:*]
                Resource: '*'
              - Effect: Allow
                Action: [iam:PassRole]
                Resource: !GetAtt CfnDeployRole.Arn

  # ---------------------------------------------------------------- Pipeline
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: mathquiz-pipeline
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore: { Type: S3, Location: !Ref ArtifactBucket }
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref CodeStarConnectionArn
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: !Ref GitHubBranch
                DetectChanges: true
              OutputArtifacts: [{ Name: SourceOut }]

        - Name: Build
          Actions:
            - Name: BuildAndTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration: { ProjectName: !Ref BuildProject }
              InputArtifacts: [{ Name: SourceOut }]
              OutputArtifacts: [{ Name: BuildOut }]

        - Name: Deploy
          Actions:
            - Name: DeployAppStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: mathquiz-app
                Capabilities: CAPABILITY_NAMED_IAM
                RoleArn: !GetAtt CfnDeployRole.Arn
                TemplatePath: BuildOut::infra/template.yaml
                # ImageUri comes from params.json (emitted by buildspec);
                # FlaskSecretKey is a static override on the action.
                TemplateConfiguration: BuildOut::params.json
                ParameterOverrides: !Sub '{"FlaskSecretKey":"${FlaskSecretKey}"}'
              InputArtifacts: [{ Name: BuildOut }]

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  EcrRepoUri:
    Value: !GetAtt EcrRepo.RepositoryUri