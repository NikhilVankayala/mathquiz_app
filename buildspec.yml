version: 0.2

# CodeBuild pipeline:
#   1. Stand up a throwaway MySQL (Docker) and load schema into a TEST database.
#   2. Run pytest against it — the db_cleanup fixture truncates/reseeds freely,
#      and because DB_NAME points at the disposable DB, real data is never at risk.
#   3. Build the Lambda container image, push to ECR.
#   4. Emit params.json so the CloudFormation deploy stage gets the image URI.
#
# Env vars set by pipeline.yaml: AWS_ACCOUNT_ID, AWS_DEFAULT_REGION, ECR_REPO_NAME

phases:
  pre_build:
    commands:
      - echo "== ECR login =="
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO_NAME
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}

      - echo "== Start throwaway MySQL =="
      - docker run -d --name testdb -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=mathquiz_test -p 3306:3306 mysql:8.0
      # Wait until MySQL is truly ready: not just pinging, but accepting an
      # authenticated root query. The image reports "up" on the socket before it
      # finishes applying MYSQL_ROOT_PASSWORD, so a plain ping races ahead and
      # the next command gets "Access denied". This loop only breaks once
      # password auth actually works.
      - |
        for i in $(seq 1 40); do
          if docker exec testdb mysql -uroot -proot -e "SELECT 1" >/dev/null 2>&1; then
            echo "MySQL is ready"; break
          fi
          echo "waiting for mysql ($i)"; sleep 3
          if [ "$i" -eq 40 ]; then echo "MySQL never became ready"; exit 1; fi
        done
      # Load schema into the TEST database. cat | exec avoids host-vs-container
      # stdin-redirect ambiguity.
      - cat schema.sql | docker exec -i testdb mysql -uroot -proot mathquiz_test

  build:
    commands:
      - echo "== Run tests =="
      - pip install -r requirements.txt
      - pip install pytest coverage
      # Point the app + test fixtures at the throwaway DB. DB_NAME is disposable,
      # so the truncating db_cleanup fixture can never touch real data.
      - export DB_HOST=127.0.0.1
      - export DB_PORT=3306
      - export DB_USER=root
      - export DB_PASSWORD=root
      - export DB_NAME=mathquiz_test
      - pytest -q

      - echo "== Build & push image =="
      - docker build -f Dockerfile.lambda -t $REPO_URI:$IMAGE_TAG .
      - docker push $REPO_URI:$IMAGE_TAG
      - echo "Pushed $REPO_URI:$IMAGE_TAG"

  post_build:
    commands:
      # Hand the image URI to CloudFormation as a template configuration file.
      - printf '{"Parameters":{"ImageUri":"%s"}}' "$REPO_URI:$IMAGE_TAG" > params.json
      - cat params.json

artifacts:
  files:
    - infra/template.yaml
    - params.json
  discard-paths: no